<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FFFDF5" rx="24"/>
  <rect x="20" y="20" width="360" height="360" fill="#FFFFFF" stroke="#EAE6DC" stroke-width="2" stroke-dasharray="6 6" rx="20"/>
  
  <!-- Supplement Jar Silhouette -->
  <g transform="translate(140, 110)">
    <!-- Lid -->
    <rect x="25" y="0" width="70" height="18" rx="5" fill="#252525"/>
    <rect x="20" y="16" width="80" height="8" rx="2" fill="#333333"/>
    
    <!-- Jar Body -->
    <rect x="10" y="24" width="100" height="150" rx="16" fill="#F8F6F0" stroke="#EAE6DC" stroke-width="2"/>
    
    <!-- Label -->
    <rect x="10" y="55" width="100" height="85" fill="#FFF4D6"/>
    <rect x="20" y="68" width="80" height="6" rx="3" fill="#F4BE38"/>
    <rect x="30" y="80" width="60" height="4" rx="2" fill="#252525" opacity="0.6"/>
    <rect x="35" y="90" width="50" height="3" rx="1.5" fill="#858585"/>
    
    <!-- Certified Seal -->
    <circle cx="60" cy="115" r="10" fill="#F4BE38"/>
    <path d="M57 115 L59 117 L63 113" stroke="#252525" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#252525" text-anchor="middle" letter-spacing="0.5">AUTHENTIC PACKAGING</text>
  <text x="200" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#858585" text-anchor="middle" letter-spacing="1">SAI FITNESS VERIFIED PRODUCT</text>
</svg>